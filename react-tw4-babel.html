<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React + Tailwind v4 — Babel Standalone</title>

  <!-- 1. Tailwind v4 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Import map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>

  <!-- 3. Babel standalone — transforms text/babel scripts in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Configure Babel to use the automatic JSX runtime (imports jsx() from react/jsx-runtime)
    // instead of the classic runtime (which needs React in scope)
    Babel.registerPreset("tsx-auto", {
      presets: [
        [Babel.availablePresets["react"], { runtime: "automatic" }],
        [Babel.availablePresets["typescript"], { isTSX: true, allExtensions: true }],
      ],
    });
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="tsx-auto">
    import { useState } from "react";
    import { createRoot } from "react-dom/client";

    interface TodoItem {
      text: string;
      done: boolean;
    }

    function App() {
      const [items, setItems] = useState<TodoItem[]>([
        { text: "Learn React", done: false },
        { text: "Use Tailwind v4", done: false },
      ]);
      const [input, setInput] = useState<string>("");

      const addItem = () => {
        if (input.trim()) {
          setItems([...items, { text: input.trim(), done: false }]);
          setInput("");
        }
      };

      const toggleItem = (index: number) => {
        setItems(items.map((item, i) =>
          i === index ? { ...item, done: !item.done } : item
        ));
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-lg p-6 max-w-md w-full space-y-4">
            <h1 className="text-2xl font-bold text-slate-800">📝 Todo List</h1>
            <p className="text-slate-400 text-xs">Babel Standalone — TSX with full TypeScript support</p>
            <div className="flex gap-2">
              <input
                value={input}
                onChange={(e: React.ChangeEvent<HTMLInputElement>) => setInput(e.target.value)}
                onKeyDown={(e: React.KeyboardEvent) => e.key === "Enter" && addItem()}
                placeholder="Add a task..."
                className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <button
                onClick={addItem}
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer"
              >
                Add
              </button>
            </div>
            <ul className="space-y-2">
              {items.map((item: TodoItem, i: number) => (
                <li key={i} className="flex items-center justify-between px-3 py-2 bg-slate-50 rounded-lg">
                  <span
                    onClick={() => toggleItem(i)}
                    className={`text-sm cursor-pointer ${item.done ? "line-through text-slate-400" : "text-slate-700"}`}
                  >
                    {item.text}
                  </span>
                  <button
                    onClick={() => setItems(items.filter((_, j) => j !== i))}
                    className="text-red-400 hover:text-red-600 text-xs cursor-pointer"
                  >
                    ✕
                  </button>
                </li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
